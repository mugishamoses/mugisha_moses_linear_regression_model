[project]
name = "graduate-debt-api"
version = "0.1.0"
description = "FastAPI service serving the graduate-debt regression model"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "joblib>=1.6.0",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "python-multipart>=0.0.34",
    "scikit-learn==1.9.1",  # must match the version that trained best_model.pkl
    "uvicorn>=0.54.0",
]
